<script>
(async () => {
  const msg = document.getElementById("m");
  const b64 = s => {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
  };
  try {
    const k = new URLSearchParams(location.hash.slice(1)).get("k");
    if (!k) throw new Error("This link is missing its key (the part after #). Ask for the full link.");
    if (!window.crypto || !crypto.subtle) throw new Error("This browser can't decrypt the report (needs HTTPS and a modern browser).");
    const p = JSON.parse(document.getElementById("payload").textContent);
    const key = await crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"]);
    let plain;
    try {
      plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(p.iv)}, key, b64(p.ct));
    } catch (e) {
      throw new Error("Wrong or damaged key. Check that the whole link was copied.");
    }
    // Swap in the decrypted document (head + body), so its title and styles fully replace the loader.
    const doc = new DOMParser().parseFromString(new TextDecoder().decode(plain), "text/html");
    document.replaceChild(document.adoptNode(doc.documentElement), document.documentElement);
    // In-page links (#opt1...) would replace the #k=key fragment; scroll instead so the URL keeps its key.
    document.addEventListener("click", ev => {
      const a = ev.target.closest && ev.target.closest('a[href^="#"]');
      if (!a) return;
      ev.preventDefault();
      const el = document.getElementById(decodeURIComponent(a.getAttribute("href").slice(1)));
      if (el) el.scrollIntoView({behavior: "smooth"});
    });
  } catch (e) {
    msg.textContent = e.message;
  }
})();
</script></body></html>
